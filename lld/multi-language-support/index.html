<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Language Demo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Header with Language Switcher -->
  <header>
    <nav>
      <a href="index.html" class="active" data-i18n="nav.home">Home</a>
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="contact.html" data-i18n="nav.contact">Contact</a>
    </nav>
    <div>
      <button class="lang-btn" data-lang="en">English</button>
      <button class="lang-btn" data-lang="hi">हिन्दी</button>
    </div>
  </header>

  <!-- Page Content -->
  <main>
    <h1 data-i18n="home.title">Welcome to Multi-Language App</h1>
    <p data-i18n="home.desc">This is a simple demo of language localization using a config file.</p>
    
    <div class="card">
      <h3 data-i18n="nav.about">About</h3>
      <p data-i18n="about.desc">We create simple, scalable frontend architectures with multi-language support.</p>
    </div>
  </main>

  <script src="config/i18n-config.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
