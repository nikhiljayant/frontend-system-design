<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Header with Language Switcher -->
  <header>
    <nav>
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="contact.html" class="active" data-i18n="nav.contact">Contact</a>
    </nav>
    <div>
      <button class="lang-btn" data-lang="en">English</button>
      <button class="lang-btn" data-lang="hi">हिन्दी</button>
    </div>
  </header>

  <!-- Page Content -->
  <main>
    <h1 data-i18n="contact.title">Contact Us</h1>
    <p data-i18n="contact.desc">Feel free to send us a message anytime.</p>

    <div class="card">
      <form onsubmit="event.preventDefault(); alert('Submitted!');">
        <input type="text" data-i18n-placeholder="contact.namePlaceholder" placeholder="Enter your name" style="width: 100%; box-sizing: border-box;">
        <br><br>
        <button type="submit" data-i18n="contact.submitBtn">Submit</button>
      </form>
    </div>
  </main>

  <script src="config/i18n-config.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
